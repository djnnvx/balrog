[package]
name = "balrog"
version = "0.1.0"
edition = "2021"

[dependencies]
capstone = "0.13"
goblin = "0.10"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
